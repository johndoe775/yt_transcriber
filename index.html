<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131b">
  <meta name="description" content="Get and translate transcripts from YouTube videos.">
  <meta name="backend-api-url" content="__BACKEND_API_URL__">
  <title>YT Transcriber</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #11131b;
      color: #f3f4f8;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --panel: #1a1d29;
      --border: #303548;
      --muted: #a4a9ba;
      --accent: #a78bfa;
      --accent-hover: #8b5cf6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% -20%, #282342 0, transparent 55%),
        #11131b;
    }

    button, input, select { font: inherit; }

    .shell {
      width: min(880px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0;
    }

    header { margin-bottom: 28px; }

    .eyebrow {
      color: var(--accent);
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: clamp(2rem, 6vw, 3.2rem);
      letter-spacing: -.045em;
    }

    header p, .hint { color: var(--muted); line-height: 1.6; }
    header p { margin: 0; max-width: 620px; }

    .panel, .result-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      box-shadow: 0 18px 60px #0003;
    }

    .panel { padding: clamp(18px, 4vw, 30px); }
    .field { margin-bottom: 20px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: .9rem;
      font-weight: 650;
    }

    input, select {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid #3a4055;
      border-radius: 9px;
      outline: none;
      background: #121521;
      color: #f3f4f8;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #a78bfa2e;
    }

    .hint { margin: 7px 0 0; font-size: .82rem; }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: var(--accent);
      color: #171322;
      cursor: pointer;
      font-weight: 750;
      transition: background .15s ease, transform .15s ease;
    }

    button:hover:not(:disabled) {
      background: #b9a3ff;
      transform: translateY(-1px);
    }

    button.secondary {
      border-color: #3a4055;
      background: #242838;
      color: #f3f4f8;
    }

    button.secondary:hover:not(:disabled) { background: #30364a; }
    button:disabled { cursor: wait; opacity: .65; }

    .status {
      min-height: 24px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .status.error { color: #fca5a5; }
    .status.success { color: #86efac; }

    #results { display: grid; gap: 16px; margin-top: 20px; }
    #results[hidden] { display: none; }

    .result-card { min-width: 0; padding: 20px; }

    .result-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h2 { margin: 0; font-size: 1.1rem; }

    .result-heading button { min-height: 36px; padding: 7px 11px; font-size: .84rem; }

    .meta { margin: 0 0 14px; color: var(--muted); font-size: .84rem; }

    .transcript {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.75;
      font-family: inherit;
    }

    footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: .82rem;
      text-align: center;
    }

    @media (max-width: 560px) {
      .shell { padding: 40px 0; }
      .options { grid-template-columns: 1fr; gap: 0; }
      .actions button { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">YouTube tools</div>
      <h1>YT Transcriber</h1>
      <p>Fetch a video's captions or translate them with your API's installed Argos language models.</p>
    </header>

    <form class="panel" id="transcriber-form">
      <div class="field">
        <label for="video-url">YouTube video URL or ID</label>
        <input id="video-url" name="url" type="text"
          placeholder="https://www.youtube.com/watch?v=..." autocomplete="url" required>
      </div>

      <div class="options">
        <div class="field">
          <label for="source-language">Transcript language</label>
          <select id="source-language" name="source_language">
            <option value="auto">Auto detect</option>
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="pt">Portuguese</option>
            <option value="zh">Chinese</option>
          </select>
        </div>
        <div class="field">
          <label for="target-language">Translation language</label>
          <select id="target-language" name="target_language">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="pt">Portuguese</option>
            <option value="zh">Chinese</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button type="submit" data-action="transcript">Get transcript</button>
        <button type="submit" class="secondary" data-action="translate">Translate</button>
        <button type="button" class="secondary" id="check-api">Check API</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <section id="results" aria-label="Results" hidden></section>
    <footer>Translation is available when the API has the matching Argos language models installed.</footer>
  </main>

  <script>
    const form = document.querySelector("#transcriber-form");
    const status = document.querySelector("#status");
    const results = document.querySelector("#results");
    const buttons = [...form.querySelectorAll("button")];
    const configuredApiUrl = document.querySelector('meta[name="backend-api-url"]').content.trim();

    function setStatus(message, kind = "") {
      status.textContent = message;
      status.className = `status ${kind}`.trim();
    }

    function getApiBase() {
      let url;
      try {
        url = new URL(configuredApiUrl);
      } catch {
        throw new Error("The backend URL is not configured. Set the BACKEND_API_URL GitHub secret and redeploy Pages.");
      }
      if (url.protocol !== "https:") {
        throw new Error("The backend URL must use HTTPS.");
      }
      return url.href.replace(/\/+$/, "");
    }

    async function requestJson(path, params) {
      const response = await fetch(`${getApiBase()}${path}?${params}`);
      let data;
      try {
        data = await response.json();
      } catch {
        throw new Error(`The API returned an unreadable response (HTTP ${response.status}).`);
      }
      if (!response.ok) {
        throw new Error(data.detail || `The API request failed (HTTP ${response.status}).`);
      }
      return data;
    }

    function addResult(title, text, meta = "") {
      const card = document.createElement("article");
      card.className = "result-card";

      const heading = document.createElement("div");
      heading.className = "result-heading";
      const headingText = document.createElement("h2");
      headingText.textContent = title;
      const copyButton = document.createElement("button");
      copyButton.type = "button";
      copyButton.className = "secondary";
      copyButton.textContent = "Copy";
      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(text);
          setStatus("Copied to clipboard.", "success");
        } catch {
          setStatus("Could not access the clipboard. Select and copy the text instead.", "error");
        }
      });
      heading.append(headingText, copyButton);

      if (meta) {
        const metadata = document.createElement("p");
        metadata.className = "meta";
        metadata.textContent = meta;
        card.append(heading, metadata);
      } else {
        card.append(heading);
      }

      const content = document.createElement("pre");
      content.className = "transcript";
      content.textContent = text;
      card.append(content);
      results.append(card);
    }

    function showResults() {
      results.replaceChildren();
      results.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const action = event.submitter?.dataset.action;
      if (!action) return;

      const formData = new FormData(form);
      const params = new URLSearchParams({
        url: formData.get("url").trim(),
        source_language: formData.get("source_language"),
      });
      if (action === "translate") {
        params.set("target_language", formData.get("target_language"));
      }

      buttons.forEach((button) => { button.disabled = true; });
      setStatus(action === "translate" ? "Fetching and translating…" : "Fetching transcript…");
      results.hidden = true;

      try {
        const data = await requestJson(`/${action}`, params);
        showResults();
        if (action === "transcript") {
          const transcript = data.text || "";
          const paragraphs = data.paragraphs?.length ? data.paragraphs.join("\n\n") : transcript;
          addResult("Transcript", paragraphs, `Video ${data.video_id} · Language ${data.detected_language}`);
        } else {
          addResult(
            "Translation",
            data.translated_transcript || "",
            `Video ${data.video_id} · ${data.source_language} → ${data.translated_to}`
          );
          addResult("Original transcript", data.original_transcript || "");
        }
        setStatus("Done.", "success");
      } catch (error) {
        setStatus(error.message || "Request failed. Check the API URL and try again.", "error");
      } finally {
        buttons.forEach((button) => { button.disabled = false; });
      }
    });

    document.querySelector("#check-api").addEventListener("click", async () => {
      const checkButton = document.querySelector("#check-api");
      checkButton.disabled = true;
      setStatus("Checking API…");
      try {
        await requestJson("/health", new URLSearchParams());
        setStatus("API is online. Translation requires the matching Argos models.", "success");
      } catch (error) {
        setStatus(error.message || "Could not reach the API.", "error");
      } finally {
        checkButton.disabled = false;
      }
    });
  </script>
</body>
</html>
